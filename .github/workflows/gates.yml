name: gates

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check all scripts
        run: |
          for f in scripts/*.js; do
            node --check "$f"
          done

      # A gate that always fails is as useless as one that always passes, so the
      # deliberately broken fixture must FAIL and the reference fixture MUST PASS.
      - name: Fixture must FAIL validate
        run: |
          if node scripts/validate-kb.js evals/fixtures/broken-kb.json; then
            echo "::error::validate-kb.js passed a deliberately broken KB"
            exit 1
          fi

      - name: Reference fixture must PASS validate
        run: node scripts/validate-kb.js evals/fixtures/mini-valid-kb.json

      - name: Fixture must FAIL index hygiene
        run: |
          if node scripts/index-hygiene.js evals/fixtures/broken-kb.json; then
            echo "::error::index-hygiene.js passed a deliberately broken KB"
            exit 1
          fi

      - name: Reference fixture must PASS index hygiene
        run: node scripts/index-hygiene.js evals/fixtures/mini-valid-kb.json

      - name: Fixture must FLAG the anchor limit on an entity query
        run: |
          # The probe is expected to fail this fixture, so do not let `set -e`
          # abort before the assertion runs.
          node scripts/query-probe.js evals/fixtures/broken-kb.json \
            --query 主角 --out "$RUNNER_TEMP/probe.json" > /dev/null || true
          node -e "
            const r = require('$RUNNER_TEMP/probe.json');
            if (!(r.checks.anchor_limit_exceeded > 0)) {
              console.error('query-probe.js did not report anchors above maxAnchors');
              process.exit(1);
            }
          "

      - name: Query regression must PASS on the reference fixture
        run: |
          node scripts/query-probe.js evals/fixtures/mini-valid-kb.json \
            --expect evals/fixtures/mini-valid-queries.json --top-k 5

      - name: Chatbox runtime gate must PASS on the reference fixture
        run: node scripts/validate-chatbox.js evals/fixtures/mini-valid-kb.json

      - name: CLI must accept flags before the positional argument
        run: |
          node scripts/validate-kb.js --out "$RUNNER_TEMP/v.json" evals/fixtures/mini-valid-kb.json
          test -s "$RUNNER_TEMP/v.json"

      - name: Migration must keep the gates green
        run: |
          node scripts/migrate-kb.js evals/fixtures/mini-valid-kb.json \
            --out "$RUNNER_TEMP/migrated.json" --sort-sections --backfill-story-time
          node scripts/validate-kb.js "$RUNNER_TEMP/migrated.json"
          node scripts/index-hygiene.js "$RUNNER_TEMP/migrated.json"
          node scripts/query-probe.js "$RUNNER_TEMP/migrated.json" \
            --expect evals/fixtures/mini-valid-queries.json --top-k 5

      - name: Backfill pipe must accept a well-formed patch
        run: |
          node scripts/export-worklist.js evals/fixtures/mini-valid-kb.json \
            --out-dir "$RUNNER_TEMP/worklist"
          test -s "$RUNNER_TEMP/worklist/chapter-map.json"
          printf '%s\n' '{"card_id":"m000001","ch":[1],"method":"ev_row","confidence":"high"}' > "$RUNNER_TEMP/ch.jsonl"
          printf '%s\n' '{"card_id":"m000001","chapter":"ch0002","quote":"雨还没停，他站在山门前没有动。"}' > "$RUNNER_TEMP/quotes.jsonl"
          node scripts/apply-patch.js evals/fixtures/mini-valid-kb.json \
            --ch "$RUNNER_TEMP/ch.jsonl" --quotes "$RUNNER_TEMP/quotes.jsonl" \
            --out "$RUNNER_TEMP/patched.json"
          node scripts/validate-kb.js "$RUNNER_TEMP/patched.json"
          node scripts/validate-chatbox.js "$RUNNER_TEMP/patched.json"

      - name: Backfill must reject an out-of-range chapter ordinal
        run: |
          printf '%s\n' '{"card_id":"m000001","ch":[99999],"method":"ev_row","confidence":"high"}' > "$RUNNER_TEMP/bad-ch.jsonl"
          if node scripts/apply-patch.js evals/fixtures/mini-valid-kb.json \
            --ch "$RUNNER_TEMP/bad-ch.jsonl" --out "$RUNNER_TEMP/bad.json"; then
            echo "::error::apply-patch.js accepted an out-of-range chapter ordinal"
            exit 1
          fi

      - name: Benchmark must run and stay within the baseline
        if: matrix.node == 22
        run: |
          node scripts/bench-kb.js evals/fixtures/mini-valid-kb.json \
            --auto-queries 3 --out "$RUNNER_TEMP/bench.json"
          node scripts/bench-kb.js evals/fixtures/mini-valid-kb.json \
            --auto-queries 3 --baseline evals/bench/baseline-mini.json

      - name: Quality benchmark must run end to end
        if: matrix.node == 22
        run: |
          node scripts/bench-quality.js evals/fixtures/mini-valid-kb.json \
            --per-bucket 1 --no-gate --out "$RUNNER_TEMP/quality.json"
          node -e "
            const r = require(process.env.RUNNER_TEMP + '/quality.json');
            const buckets = r.buckets || {};
            const scored = Object.values(buckets).filter(b => typeof b.hit5 === 'number');
            if (!scored.length) {
              console.error('bench-quality.js produced no per-category metrics');
              process.exit(1);
            }
            console.log('quality buckets', JSON.stringify(Object.fromEntries(scored.map(b => [b.label, b.hit5]))));
          "

      - name: Compact must not lose protected records
        run: |
          set -o pipefail
          node scripts/compact-kb.js evals/fixtures/broken-kb.json \
            --out "$RUNNER_TEMP/compacted.json" > "$RUNNER_TEMP/compact.json"
          node -e "
            const r = require('$RUNNER_TEMP/compact.json');
            if (r.protected_lost !== 0) { console.error('protected_lost =', r.protected_lost); process.exit(1); }
          "

      - name: Compacted reference fixture must still pass every gate
        run: |
          set -o pipefail
          node scripts/compact-kb.js evals/fixtures/mini-valid-kb.json --out "$RUNNER_TEMP/mini-compacted.json"
          node scripts/validate-kb.js "$RUNNER_TEMP/mini-compacted.json"
          node scripts/index-hygiene.js "$RUNNER_TEMP/mini-compacted.json"
          node scripts/query-probe.js "$RUNNER_TEMP/mini-compacted.json" \
            --expect evals/fixtures/mini-valid-queries.json --top-k 5
